<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | Centro de Conciliación Laboral | Michoacán</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --ccl-marron: #911A3A; }
        .calculadora-shell { background: #fff; border-radius: 18px; box-shadow: 0 10px 28px rgba(0,0,0,0.08); padding: 1.75rem; }
        .calc-label { font-weight: 700; color: var(--ccl-marron); margin-bottom: 0.35rem; }
        .btn-ccl { background-color: var(--ccl-marron); color: white; font-weight: bold; border: none; }
        .btn-ccl:hover { background-color: #72142d; color: white; }
    </style>
</head>
<body class="bg-light">

<main class="container my-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold">Calculadora de Liquidación Michoacán 2026</h2>
        <p class="text-muted">Salario Mínimo Vigente: $315.04</p>
    </div>

    <div class="calculadora-shell">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="calc-label">Periodo de pago</label>
                <select id="periodoSel" class="form-select">
                    <option value="1">Diario</option>
                    <option value="7">Semanal</option>
                    <option value="15">Quincenal</option>
                    <option value="30">Mensual</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="calc-label">Salario Bruto ($)</label>
                <input id="salarioInput" type="number" class="form-control" placeholder="0.00">
            </div>
            <div class="col-md-3">
                <label class="calc-label">Fecha Ingreso</label>
                <input id="fIngreso" type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="calc-label">Fecha Egreso</label>
                <input id="fEgreso" type="date" class="form-control">
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button class="btn btn-ccl px-4" onclick="calcular()">Calcular</button>
            <button id="btnPDF" class="btn btn-danger d-none" onclick="generarPDF()">
                <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
            </button>
        </div>

        <div id="resultados" class="mt-5 d-none">
            <h5 class="calc-label border-bottom pb-2">Desglose de Prestaciones</h5>
            <div id="resAntiguedad" class="mb-3 fw-bold text-secondary"></div>
            <div class="table-responsive">
                <table class="table">
                    <thead class="table-light">
                        <tr>
                            <th>Concepto</th>
                            <th>Monto ($)</th>
                            <th>Estatus</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    const SALARIO_MINIMO = 315.04;
    const TOPE_PRIMA = SALARIO_MINIMO * 2;
    let datosGlobales = {};

    function obtenerDiasVacaciones(anios) {
        if (anios < 1) return 12;
        if (anios === 1) return 12;
        if (anios === 2) return 14;
        if (anios === 3) return 16;
        if (anios === 4) return 18;
        if (anios === 5) return 20;
        if (anios >= 6 && anios <= 10) return 22;
        if (anios >= 11 && anios <= 15) return 24;
        if (anios >= 16 && anios <= 20) return 26;
        if (anios >= 21 && anios <= 25) return 28;
        if (anios >= 26 && anios <= 30) return 30;
        return 32;
    }

    function calcular() {
        const periodo = parseFloat(document.getElementById('periodoSel').value);
        const pago = parseFloat(document.getElementById('salarioInput').value);
        const f1 = new Date(document.getElementById('fIngreso').value);
        const f2 = new Date(document.getElementById('fEgreso').value);

        if (!pago || isNaN(f1.getTime()) || isNaN(f2.getTime())) {
            alert("Por favor, complete todos los campos correctamente.");
            return;
        }

        const sdb = pago / periodo;
		console.log(sdb);
        const diffTime = Math.abs(f2 - f1);
        const totalDias = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        const aniosCompletos = Math.floor(totalDias / 365);
		// Cálculo específico para los días de aguinaldo del año en curso
		const fechaEgreso = new Date(document.getElementById('fEgreso').value);
		const inicioAnio = new Date(fechaEgreso.getFullYear(), 0, 1); // 1 de enero del mismo año

		// Diferencia en milisegundos convertida a días
		const diasAguinaldo = Math.ceil((fechaEgreso - inicioAnio) / (1000 * 60 * 60 * 24)) + 1;

		// Ejemplo con salario diario base (sdb)[cite: 1]
		const montoAguinaldo = (15 / 365) * diasAguinaldo * sdb;

        // Vacaciones: Basado en salario ingresado y tabla de días
        const diasVacDerecho = obtenerDiasVacaciones(aniosCompletos);
        const montoVac = (diasVacDerecho / 365) * diasAguinaldo * sdb;
        const montoPV = montoVac * 0.25;

        // Otros conceptos basados en SDB e Indemnización
        const montoIndem = sdb * 90;

        // Prima Antigüedad: Topada a 2 salarios mínimos ($630.08)
        const sdbTopado = Math.min(sdb, TOPE_PRIMA);
        const montoAntig = (12 / 365) * totalDias * sdbTopado;
        const esObligatoria = aniosCompletos >= 15;

        datosGlobales = {
            resumen: `Antigüedad: ${aniosCompletos} años (${totalDias} días totales)`,
            sdb: sdb.toFixed(2),
            items: [
                ["Aguinaldo Proporcional", montoAguinaldo.toFixed(2), "Irrenunciable"],
                ["Vacaciones (" + diasVacDerecho + " días)", montoVac.toFixed(2), "Irrenunciable"],
                ["Prima Vacacional (25%)", montoPV.toFixed(2), "Irrenunciable"],
                ["Indemnización Constitucional (90 días)", montoIndem.toFixed(2), "Negociable"],
                ["Prima de Antigüedad", montoAntig.toFixed(2), esObligatoria ? "Obligatoria (>=15 años)" : "Negociable"]
            ]
        };

        render();
    }

    function render() {
        document.getElementById('resAntiguedad').innerText = datosGlobales.resumen;
        const cuerpo = document.getElementById('cuerpoTabla');
        cuerpo.innerHTML = datosGlobales.items.map(i => `
            <tr>
                <td>${i[0]}</td>
                <td><strong>$${i[1]}</strong></td>
                <td><span class="badge ${i[2].includes('Irrenunciable') || i[2].includes('Obligatoria') ? 'bg-success' : 'bg-warning text-dark'}">${i[2]}</span></td>
            </tr>
        `).join('');
        
        document.getElementById('resultados').classList.remove('d-none');
        document.getElementById('btnPDF').classList.remove('d-none');
    }

    function generarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFillColor(145, 26, 58);
        doc.rect(0, 0, 210, 30, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(16);
        doc.text("CENTRO DE CONCILIACIÓN LABORAL MICHOACÁN", 105, 18, { align: 'center' });
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(10);
        doc.text(datosGlobales.resumen, 14, 40);
        doc.text(`Salario Diario Base: $${datosGlobales.sdb}`, 14, 46);

        doc.autoTable({
            startY: 55,
            head: [['Concepto', 'Monto ($)', 'Estatus']],
            body: datosGlobales.items,
            headStyles: { fillColor: [145, 26, 58] }
        });

        doc.save("Calculo_Liquidacion_Michoacan.pdf");
    }
</script>
</body>
</html>
